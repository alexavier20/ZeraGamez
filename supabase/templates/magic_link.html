<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; background: #0b0a10; color: #f5f3fa; font-family: Arial, sans-serif">
    <main style="margin: 0 auto; max-width: 520px; padding: 32px 20px">
      <p style="color: #b9b5c5; font-size: 14px; margin: 0 0 8px">Zera GameZ</p>
      <h1 style="font-size: 22px; margin: 0 0 12px">Seu código de acesso</h1>
      <p style="color: #d1cdda; line-height: 1.5; margin: 0 0 24px">
        Digite este código na tela de acesso para entrar na sua conta.
      </p>
      <p
        style="background: #191622; border-radius: 8px; color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: 8px; margin: 0; padding: 16px; text-align: center"
      >
        {{ .Token }}
      </p>
      <p style="color: #a7a2b3; font-size: 13px; line-height: 1.5; margin: 24px 0 0">
        Se você não solicitou este código, ignore esta mensagem.
      </p>
    </main>
  </body>
</html>
